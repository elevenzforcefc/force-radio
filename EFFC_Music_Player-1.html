
<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ELEVENZ FORCE | FORCE RADIO</title>
<style>
*{box-sizing:border-box}
body{
margin:0;min-height:100vh;padding:20px;
display:grid;place-items:center;
background:linear-gradient(145deg,#241207,#090b10);
color:white;font-family:Arial,sans-serif}
.player{
width:100%;max-width:540px;
background:#171a20;border:1px solid #393939;
border-radius:22px;overflow:hidden}
header{
padding:28px 24px;
background:linear-gradient(120deg,#ff7900,#a93808)}
header small{font-weight:bold;letter-spacing:2px}
h1{font-size:42px;margin:15px 0 5px}
header p{font-size:12px;letter-spacing:2px}
main{padding:20px}
.tag{color:#ff993d;font-size:13px;font-weight:bold}
.video{
margin-top:15px;aspect-ratio:16/9;
background:black;border-radius:12px;overflow:hidden}
iframe{width:100%;height:100%;border:0}
#status{color:#c5c5c5;font-size:13px;line-height:1.6}
a{
display:block;text-align:center;padding:14px;
margin-top:10px;border-radius:10px;
text-decoration:none;font-weight:bold}
.primary{background:#ff7900;color:#111}
.secondary{background:#30343b;color:white}
footer{
text-align:center;color:#999;
font-size:11px;padding:20px}
</style>
</head>
<body>
<div class="player">
<header>
<small>ELEVENZ FORCE FC • OFFICIAL MUSIC</small>
<h1>FORCE RADIO ▶</h1>
<p>ONE CLUB ONE FORCE</p>
</header>
<main>
<div class="tag">🎵 YOUTUBE PLAYLIST</div>
<div class="video">
<div id="youtube-player"></div>
</div>
<p id="status">Loading YouTube Player...</p>
<a class="primary"
href="https://music.youtube.com/playlist?list=PLlyuF5efWWnnGyxWFojdz5fYuoePM_SVb"
target="_blank" rel="noopener noreferrer">
♫ OPEN YOUTUBE MUSIC
</a>
<a class="secondary"
href="https://www.youtube.com/playlist?list=PLlyuF5efWWnnGyxWFojdz5fYuoePM_SVb"
target="_blank" rel="noopener noreferrer">
VIEW PLAYLIST
</a>
</main>
<footer>ELEVENZ FORCE FC • PROTOTYPE 2027</footer>
</div>
<script>
const playlist="PLlyuF5efWWnnGyxWFojdz5fYuoePM_SVb";
const status=document.getElementById("status");
let player;
function onYouTubeIframeAPIReady(){
player=new YT.Player("youtube-player",{
width:"100%",
height:"100%",
playerVars:{
listType:"playlist",
list:playlist,
playsinline:1,
rel:0,
origin:window.location.origin
},
events:{
onReady:function(){
status.textContent="Player ready. Tekan Play untuk mula mendengar.";
},
onError:function(e){
const errors={
2:"Video ID tidak sah.",
5:"Video tidak dapat dimainkan.",
100:"Video tidak tersedia.",
101:"Video tidak membenarkan embedded playback.",
150:"Video tidak membenarkan embedded playback."
};
status.textContent=(errors[e.data]||"Playback error.")+
" Cuba buka YouTube Music melalui pautan di bawah.";
}
}
});
}
</script>
<script src="https://www.youtube.com/iframe_api"></script>
</body>
</html>
