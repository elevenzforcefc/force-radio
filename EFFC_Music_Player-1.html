<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#111111">
  <title>FORCE RADIO | ELEVENZ FORCE FC</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;background:linear-gradient(145deg,#080808,#242424);color:#fff;font-family:Arial,Helvetica,sans-serif;display:flex;justify-content:center;align-items:center;padding:20px}
    .player{width:100%;max-width:540px;background:#171717;border:1px solid #393939;border-radius:22px;overflow:hidden;box-shadow:0 20px 55px #0009}
    header{text-align:center;padding:28px 20px 22px;background:linear-gradient(150deg,#292929,#121212);border-top:6px solid #ff7900}
    small{color:#ff9b40;font-size:12px;letter-spacing:2px;font-weight:700}
    h1{font-size:34px;letter-spacing:2px;margin:12px 0;color:#fff}
    .play-icon{color:#ff7900}
    header p{font-size:12px;letter-spacing:2px;color:#ccc;margin:0}
    main{padding:22px}
    .tag{font-size:12px;letter-spacing:1.5px;font-weight:bold;color:#ff9b40;margin-bottom:12px}
    .video{position:relative;width:100%;aspect-ratio:16/9;background:#000;border-radius:12px;overflow:hidden}
    iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
    .note{color:#bbb;font-size:13px;line-height:1.5;text-align:center;margin:16px 0}
    a{display:block;text-decoration:none;text-align:center;font-weight:bold;border-radius:10px;padding:14px 12px;margin-top:11px;font-size:14px}
    .primary{background:#ff7900;color:#151515}
    .secondary{border:1px solid #ff7900;color:#ff9b40}
    footer{text-align:center;color:#888;font-size:11px;padding:0 12px 22px}
  </style>
</head>
<body>
  <div class="player">
    <header>
      <small>ELEVENZ FORCE FC · OFFICIAL MUSIC</small>
      <h1>FORCE RADIO <span class="play-icon">▶</span></h1>
      <p>ONE CLUB ONE FORCE</p>
    </header>
    <main>
      <div class="tag">🎵 VIDEO PLAYBACK TEST</div>
      <div class="video">
        <iframe
          src="https://www.youtube.com/embed/3JWTaaS7LdU?playsinline=1&rel=0"
          title="FORCE RADIO YouTube Player"
          allow="accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture; web-share"
          referrerpolicy="strict-origin-when-cross-origin"
          allowfullscreen></iframe>
      </div>
      <p class="note">Tekan ▶ pada video untuk cuba mainkan muzik terus di sini.</p>
      <a class="primary" href="https://music.youtube.com/playlist?list=PLlyuF5efWWnnGyxWFojdz5fYuoePM_SVb" target="_blank" rel="noopener noreferrer">🎵 OPEN YOUTUBE MUSIC PLAYLIST</a>
      <a class="secondary" href="https://www.youtube.com/playlist?list=PLlyuF5efWWnnGyxWFojdz5fYuoePM_SVb" target="_blank" rel="noopener noreferrer">VIEW FULL PLAYLIST</a>
    </main>
    <footer>ELEVENZ FORCE FC · PROTOTYPE 2027</footer>
  </div>
</body>
</html>
